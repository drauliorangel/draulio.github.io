<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Style Layout</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body onclick="closeStartMenu(event)">
    <div class="desktop">
        <button class="icon" onclick="openWindow('Meu Computador', event)">Meu Computador</button>
    </div>
    
    <div class="taskbar">
        <button class="start-button" onclick="toggleStartMenu(event)">☰</button>
        <div class="taskbar-text">Barra de Tarefas</div>
    </div>
    
    <div id="start-menu" class="start-menu hidden">
        <button onclick="openWindow('Configurações', event)">Configurações</button>
    </div>

    <script>
        let windows = [];

        function openWindow(title, event) {
            event.stopPropagation();
            const winId = Date.now();
            const win = document.createElement('div');
            win.className = 'window';
            win.id = `win-${winId}`;
            win.innerHTML = `
                <div class="window-header" onmousedown="dragWindow(event, 'win-${winId}')">
                    <span>${title}</span>
                    <button onclick="closeWindow(${winId})">✖</button>
                </div>
                <div class="window-content">Conteúdo de ${title}</div>
            `;
            document.body.appendChild(win);
            windows.push(winId);
        }

        function closeWindow(id) {
            const win = document.getElementById(`win-${id}`);
            if (win) win.remove();
            windows = windows.filter(w => w !== id);
        }

        function toggleStartMenu(event) {
            event.stopPropagation();
            document.getElementById('start-menu').classList.toggle('hidden');
        }

        function closeStartMenu(event) {
            if (!event.target.closest('.start-button') && !event.target.closest('.start-menu')) {
                document.getElementById('start-menu').classList.add('hidden');
            }
        }

        function dragWindow(event, winId) {
            event.preventDefault();
            const win = document.getElementById(winId);
            let shiftX = event.clientX - win.getBoundingClientRect().left;
            let shiftY = event.clientY - win.getBoundingClientRect().top;

            function moveAt(pageX, pageY) {
                win.style.left = pageX - shiftX + 'px';
                win.style.top = pageY - shiftY + 'px';
            }

            function onMouseMove(event) {
                moveAt(event.pageX, event.pageY);
            }

            document.addEventListener('mousemove', onMouseMove);

            document.onmouseup = function () {
                document.removeEventListener('mousemove', onMouseMove);
                document.onmouseup = null;
            };
        }
    </script>
</body>
</html>

<style>
    body {
        margin: 0;
        background-color: #1e3a8a;
        color: white;
        font-family: Arial, sans-serif;
    }
    .desktop {
        height: calc(100vh - 40px);
        padding: 20px;
    }
    .icon {
        background: white;
        color: black;
        padding: 10px;
        border: none;
        cursor: pointer;
    }
    .taskbar {
        position: fixed;
        bottom: 0;
        width: 100%;
        background: black;
        padding: 10px;
        display: flex;
        align-items: center;
    }
    .start-button {
        background: gray;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
    }
    .start-menu {
        position: fixed;
        bottom: 50px;
        left: 10px;
        background: #333;
        padding: 10px;
        border-radius: 5px;
    }
    .hidden {
        display: none;
    }
    .window {
        position: absolute;
        top: 50px;
        left: 50px;
        width: 200px;
        background: white;
        color: black;
        border: 1px solid gray;
        box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
    }
    .window-header {
        background: gray;
        padding: 5px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: move;
    }
    .window-content {
        padding: 10px;
    }
</style>
